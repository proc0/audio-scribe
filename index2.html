<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio File Scanner</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .picker-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      button#scan-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1rem;
        padding: 0.6rem 1.2rem;
        border: 1px solid #8884;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        cursor: pointer;
      }
      button#scan-btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      #status { font-size: 0.9rem; opacity: 0.8; }
      #file-list {
        list-style: none;
        padding: 0;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.85rem;
        line-height: 1.7;
      }
      #file-list li {
        white-space: nowrap;
        overflow-x: auto;
        border-bottom: 1px solid #8881;
        padding: 0.2rem 0;
      }
      #count { margin: 1rem 0; font-weight: 600; }
      .empty { opacity: 0.5; font-style: italic; }
    </style>
  </head>
  <body>
    <h1>🎵 Audio File Scanner</h1>

    <div class="picker-row">
      <button id="scan-btn">
        <!-- folder icon unchanged -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span id="btn-label">Select folder</span>
      </button>
      <!-- Hidden fallback for non-Chromium browsers -->
      <input type="file" id="dir-fallback" webkitdirectory directory multiple
             style="display: none" />
      <span id="status"></span>
    </div>

    <p id="count"></p>
    <ol id="file-list">
      <li class="empty">Select a folder to start scanning.</li>
    </ol>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
