<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="dimgray" media="(prefers-color-scheme: dark)" />
	<meta name="description" content="Liquid AI audio bulk transcription." />
	<title>Liquid Scribe</title>
	<link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap" />
	<link rel="stylesheet" href="style/main.css" />
	<link rel="stylesheet" href="style/theme.css" />
	<script type="module" src="script/main.js"></script>
</head>
<template id="FileSystemAccess">
	<button class="icon-button" id="folder-picker">
		<label title="Choose folder">📁</label>
	</button>
	<button class="icon-button" id="file-picker">
		<label title="Choose files">📄</label>
	</button>
</template>
<template id="OriginPrivateFileSystem">
	<button class="icon-button" id="folder-picker">
		<label title="Choose folder">📁</label>
	</button>
	<input type="file" id="input-folder-picker" webkitdirectory directory multiple style="display: none"/>
	<button class="icon-button" id="file-picker">
		<label title="Choose files">📄</label>
	</button>
	<input type="file" id="input-file-picker" multiple style="display: none"/>
</template>
<template id="None">
	<label class="error">Error! This browser does not have a compatible file system API.</label>
</template>
<template id="ModelControls">
	<!-- 💾 📥 -->
	<button class="icon-button" id="load-model">
		<label title="Load model">📥</label>
	</button>
	<button class="icon-button" id="clear-cache">
		<label title="Clear cache">✖</label>
	</button>
</template>
<body>
	<header>
		<h1>Liquid Scribe</h1>
	</header>
	<details id="info">
	  <summary>🛈 Info</summary>
	  <blockquote></blockquote>
	</details>
	<menu id="controls"></menu>
	<main>
		<progress id="loading-bar" max="100" value="0"></progress>
		<input type="radio" name="tabset" id="tab0" aria-controls="tab-content0" checked>
		<input type="radio" name="tabset" id="tab1" aria-controls="tab-content1">
		<div id="tab-labels">
			<label for="tab0" id="tab-label0" class="tab-label">INPUT</label>
			<label for="tab1" id="tab-label1" class="tab-label">OUTPUT</label>
		</div>
		<content id="tab-contents">
		    <section id="tab-content0" class="tab-content">
		    	<div class="tab-body"></div>
		    	<div class="tab-footer">
					<button class="text-button" id="confirm-transcribe">
						<label title="Confirm transcribe">Confirm</label>
					</button>
		    	</div>
		    </section>
		    <section id="tab-content1" class="tab-content">
		    	<div class="tab-body"></div>
		    	<div class="tab-footer">
					<button class="text-button" id="save-transcribe">
						<label title="Save">Save</label>
					</button>
		    	</div>
		    </section>
		</content>
	</main>
	<script type="module" src="script/init.js"></script>
</body>
</html>
