<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="black" media="(prefers-color-scheme: dark)" />
	<meta name="description" content="ASR speech to audio transcription" />
	<title>Audio Scribe</title>
	<link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap" />
	<link rel="stylesheet" href="style/main.css" />
	<link rel="stylesheet" href="style/theme.css" />
	<script type="module" src="script/main.js"></script>
</head>
<template id="FileSystemAccess">
	<button class="icon-button icon-adjust" id="folder-picker" data-title="Choose folder">🗁</button>
	<button class="icon-button" id="file-picker" data-title="Choose files">🗋</button>
</template>
<template id="OriginPrivateFileSystem">
	<button class="icon-button icon-adjust" id="folder-picker" data-title="Choose folder">🗁</button>
	<input type="file" id="input-folder-picker" webkitdirectory directory multiple style="display: none"/>
	
	<button class="icon-button" id="file-picker" data-title="Choose files">🗋</button>
	<input type="file" id="input-file-picker" multiple style="display: none"/>
</template>
<template id="None">
	<label class="error">Error! This browser does not have a compatible file system API.</label>
</template>
<template id="ModelControls">
	<button class="icon-button" id="load-model" data-title="Load model">⇩</button>
	<button class="icon-button" id="clear-cache" data-title="Clear cache">🗑</button>
	<button class="icon-button" id="settings" data-title="Settings">⏲</button>
</template>
<template id="audio-file">
	<div class="audio-header">
		<div class="audio-player">
			<audio preload="auto">Your browser does not support this audio player.</audio>
			<button class="icon-button-large button-stop hidden" title="Stop">❚❚</button>
			<button class="icon-button-large button-play" title="Play">▶</button>
			<span class="time-elapsed">--:--</span><progress max="100" value="0"></progress><span class="time-remaining">--:--</span>
			<button class="icon-button-small button-volume">🕪</button>
		</div>
		<button class="icon-button-small button-remove" title="Remove">✖</button>
	</div>
	<h3 class="audio-title"></h3>
	<div class="audio-subtitle"></div>
</template>
<!-- 🗁 🗋 ⇩ 🗑 ✔ ✘ 🗐 ⎘ ⬚ 🖋 ⚙ 🛠 ⏲ ▶ ◼ ❚❚ 🕪 🕩-->
<body>
	<div class="noise-background"></div>
	<header>
		<h1>🖋 Audio Scribe</h1>
	</header>
	<details id="info">
	  <summary>🛈 Info</summary>
	  <p id="info-body" class="detail-text"></p>
	</details>
	<menu id="controls"></menu>
	<main>
		<progress id="loading-bar" max="100" value="0"></progress>
		<!-- main content tabs -->
		<input type="radio" name="tabset" id="tab0" class="tab-input" aria-controls="tab-content0" checked>
		<input type="radio" name="tabset" id="tab1" class="tab-input" aria-controls="tab-content1">
		<input type="radio" name="tabset" id="tab2" class="tab-input" aria-controls="tab-content2">
		<div id="tab-labels">
			<label for="tab0" id="tab-label0" class="tab-label">INPUT</label>
			<label for="tab1" id="tab-label1" class="tab-label">OUTPUT</label>
			<label for="tab2" id="tab-label2" class="tab-label hidden">SETTINGS</label>
		</div>
		<content id="tab-contents" class="noise-animated">
		    <section id="tab-content0" class="tab-content">
		    	<div class="tab-body empty-input"></div>
		    	<div class="tab-footer">
					<button class="icon-button" id="transcribe" data-title="Transcribe" disabled>🖋</button>
		    	</div>
		    </section>
		    <section id="tab-content1" class="tab-content">
		    	<div class="tab-body"></div>
		    	<div class="tab-footer">
					<button class="icon-button" id="save" data-title="Save" disabled>🖫</button>
		    	</div>
		    </section>
			<section id="tab-content2" class="tab-content hidden">
		    	<div class="tab-body"></div>
		    	<div class="tab-footer">
		    	</div>
		    </section>
		</content>
	</main>
</body>
</html>
